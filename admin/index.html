<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品集後台｜LightDust Studio</title>
<link rel="stylesheet" href="/admin/admin.css">
<link rel="icon" type="image/png" href="/images/favicon-32.png">
</head>
<body>
  <header class="admin-header">
    <div class="brand">LightDust <span>Studio</span></div>
    <nav class="admin-nav">
      <a href="/admin" class="active">作品集</a>
      <a href="/admin/settings">網站設定</a>
      <a href="/admin/nav">導覽選單</a>
      <a href="/admin/hero">首頁 Hero</a>
      <a href="/admin/home-blocks">首頁模組</a>
      <a href="/admin/pages">自訂頁面</a>
      <a href="/admin/messages">訊息中心<span id="unread-badge" class="badge" hidden></span></a>
      <a href="/admin/media">媒體庫</a>
      <a href="/admin/accounts" id="accounts-nav-link" hidden>帳號管理</a>
    </nav>
    <button id="logout-btn" class="ghost-btn">登出</button>
  </header>

  <main class="admin-main">
    <section class="panel">
      <h2>新增作品（相簿）</h2>
      <p class="hint">圖片類型會先建立一個空相簿，建立後在下方清單裡逐張新增照片；影片類型請直接上傳影片檔案。</p>
      <form id="add-form" class="add-form">
        <div class="row">
          <label>分類群組
            <select name="group_key" id="group-select" required>
              <option value="photography">Photography 攝影</option>
              <option value="film">Film 影片</option>
              <option value="design">Design 設計</option>
            </select>
          </label>
          <label>子分類
            <select name="category_key" id="category-select" required></select>
          </label>
          <label>類型
            <select name="media_type" id="media-type-select" required>
              <option value="image">圖片相簿</option>
              <option value="video">影片</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label>標籤文字（顯示於卡片小標，如「商業攝影」）
            <input type="text" name="tag" required>
          </label>
          <label>作品標題
            <input type="text" name="title" required>
          </label>
          <label>排序（數字越小越前面）
            <input type="number" name="sort_order" value="0">
          </label>
        </div>
        <div class="row" id="video-file-row" hidden>
          <label>影片檔案（MP4）
            <input type="file" name="file" accept="video/mp4">
          </label>
        </div>
        <button type="submit">建立作品</button>
        <p id="add-status" class="status"></p>
      </form>
    </section>

    <section class="panel">
      <h2>作品清單</h2>
      <div id="item-groups"></div>
    </section>
  </main>

  <script src="/admin/admin.js" data-page="dashboard"></script>
</body>
</html>
