<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>媒體庫｜LightDust Studio</title>
<link rel="stylesheet" href="/admin/admin.css">
<link rel="icon" type="image/png" href="/images/favicon-32.png">
</head>
<body>
  <header class="admin-header">
    <div class="brand">LightDust <span>Studio</span></div>
    <nav class="admin-nav">
      <a href="/admin">作品集</a>
      <a href="/admin/settings">網站設定</a>
      <a href="/admin/nav">導覽選單</a>
      <a href="/admin/hero">首頁 Hero</a>
      <a href="/admin/pages">自訂頁面</a>
      <a href="/admin/messages">訊息中心<span id="unread-badge" class="badge" hidden></span></a>
      <a href="/admin/media" class="active">媒體庫</a>
      <a href="/admin/accounts" id="accounts-nav-link" hidden>帳號管理</a>
    </nav>
    <button id="logout-btn" class="ghost-btn">登出</button>
  </header>

  <main class="admin-main">
    <section class="panel">
      <div class="media-toolbar">
        <nav id="breadcrumb" class="breadcrumb"></nav>
        <button type="button" id="new-folder-btn" class="ghost-btn">＋ 新增資料夾</button>
      </div>
      <div id="new-folder-form" class="add-child-row" hidden>
        <input type="text" id="new-folder-name" placeholder="資料夾名稱" class="label-input">
        <button type="button" id="save-new-folder-btn">建立</button>
      </div>
      <p id="folder-status" class="status"></p>
    </section>

    <section class="panel">
      <h2>上傳檔案</h2>
      <p class="hint">會上傳到目前瀏覽的資料夾。支援 JPG / PNG / WEBP / GIF 圖片與 MP4 影片，可一次選取多個檔案，或直接拖放到下方區域。</p>
      <div id="dropzone" class="dropzone">
        <p>將檔案拖放到這裡，或點擊選擇檔案</p>
        <input type="file" id="file-input" multiple accept="image/*,video/mp4" hidden>
      </div>
      <p id="upload-status" class="status"></p>
    </section>

    <section class="panel">
      <h2>資料夾內容</h2>
      <div id="folder-grid" class="media-grid"></div>
      <div id="media-grid" class="media-grid"></div>
    </section>
  </main>

  <script src="/admin/admin.js" data-page="media"></script>
</body>
</html>
