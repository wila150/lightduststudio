<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>設備管理｜LightDust Studio</title>
<link rel="stylesheet" href="/admin/admin.css">
<link rel="icon" type="image/png" href="/images/favicon-32.png">
</head>
<body>
  <header class="admin-header">
    <div class="brand">LightDust <span>Studio</span></div>
    <nav class="admin-nav">
      <a href="/admin">作品集</a>
      <a href="/admin/settings">網站設定</a>
      <a href="/admin/nav">導覽選單</a>
      <a href="/admin/hero">首頁 Hero</a>
      <a href="/admin/home-blocks">首頁模組</a>
      <a href="/admin/analytics">即時統計</a>
      <a href="/admin/pages">自訂頁面</a>
      <a href="/admin/messages">訊息中心<span id="unread-badge" class="badge" hidden></span></a>
      <a href="/admin/media">媒體庫</a>
      <a href="/admin/equipment" class="active">設備管理</a>
      <a href="/admin/accounts" id="accounts-nav-link" hidden>帳號管理</a>
    </nav>
    <button id="logout-btn" class="ghost-btn">登出</button>
  </header>

  <main class="admin-main">
    <section class="panel">
      <h2>新增設備</h2>
      <p class="hint">設備會顯示在前台「我的設備」頁（/equipment），勾選「顯示於首頁」的會出現在首頁的設備區塊（建議 4–6 項）。</p>
      <form id="equip-add-form" class="add-form">
        <div class="row">
          <label>設備名稱<input type="text" name="name" placeholder="例如 Sony A7 IV" required></label>
          <label>品牌<input type="text" name="brand" placeholder="例如 Sony"></label>
          <label>類別<select name="category" class="equip-category-select"></select></label>
        </div>
        <div class="row">
          <label>簡短說明（選填）<input type="text" name="description" placeholder="例如 全片幅無反，商業攝影主力機"></label>
          <label>照片<input type="file" name="file" accept="image/*"></label>
        </div>
        <div class="row">
          <label class="checkbox-label"><input type="checkbox" name="featured" value="1"> 顯示於首頁</label>
        </div>
        <button type="submit">新增設備</button>
        <p id="equip-add-status" class="status"></p>
      </form>
    </section>

    <section class="panel">
      <h2>目前的設備</h2>
      <p class="hint">拖曳左側的 ⠿ 可以調整順序，前台會照這個順序顯示。</p>
      <div id="equip-list"></div>
      <p id="equip-list-status" class="status"></p>
    </section>
  </main>

  <script src="/admin/admin.js" data-page="equipment"></script>
</body>
</html>
