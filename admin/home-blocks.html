<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首頁模組｜LightDust Studio</title>
<link rel="stylesheet" href="/admin/admin.css">
<link rel="icon" type="image/png" href="/images/favicon-32.png">
</head>
<body>
  <header class="admin-header">
    <div class="brand">LightDust <span>Studio</span></div>
    <nav class="admin-nav">
      <a href="/admin">作品集</a>
      <a href="/admin/settings">網站設定</a>
      <a href="/admin/nav">導覽選單</a>
      <a href="/admin/hero">首頁 Hero</a>
      <a href="/admin/home-blocks" class="active">首頁模組</a>
      <a href="/admin/analytics">即時統計</a>
      <a href="/admin/pages">自訂頁面</a>
      <a href="/admin/messages">訊息中心<span id="unread-badge" class="badge" hidden></span></a>
      <a href="/admin/media">媒體庫</a>
      <a href="/admin/accounts" id="accounts-nav-link" hidden>帳號管理</a>
    </nav>
    <button id="logout-btn" class="ghost-btn">登出</button>
  </header>

  <main class="admin-main">
    <section class="panel">
      <h2>首頁模組</h2>
      <p class="hint">這裡新增的模組會依「排序」數字（越小越前面）顯示在首頁 Hero、分類區塊與關於我們之後、頁尾之前。</p>
    </section>

    <section class="panel">
      <h2>新增內容區塊</h2>
      <div class="row">
        <label>區塊類型
          <select id="block-type-select">
            <option value="heading">標題文字</option>
            <option value="text_image">圖文並排</option>
            <option value="button">按鈕</option>
            <option value="video">影片</option>
            <option value="gallery">圖片相簿</option>
          </select>
        </label>
      </div>

      <div id="block-fields-heading" class="block-fields">
        <div class="row">
          <label>標題文字<input type="text" data-f="text"></label>
          <label>副標文字（選填）<input type="text" data-f="subtitle"></label>
        </div>
      </div>

      <div id="block-fields-text_image" class="block-fields" hidden>
        <div class="row">
          <label>標題（選填）<input type="text" data-f="title"></label>
          <label>圖片位置
            <select data-f="position"><option value="left">圖片在左</option><option value="right">圖片在右</option></select>
          </label>
        </div>
        <div class="row">
          <label>內文<textarea data-f="text" rows="3"></textarea></label>
        </div>
        <div class="row">
          <label>圖片<input type="file" accept="image/*" data-upload="image_url"></label>
        </div>
      </div>

      <div id="block-fields-button" class="block-fields" hidden>
        <div class="row">
          <label>按鈕文字<input type="text" data-f="text"></label>
          <label>連結網址<input type="text" data-f="url" placeholder="/contact"></label>
        </div>
      </div>

      <div id="block-fields-video" class="block-fields" hidden>
        <div class="row">
          <label>影片來源
            <select data-f="media_type" id="video-media-type"><option value="upload">上傳 MP4</option><option value="embed">YouTube／Vimeo 連結</option></select>
          </label>
        </div>
        <div class="row" id="video-upload-row">
          <label>上傳影片檔案<input type="file" accept="video/mp4" data-upload="media_url"></label>
        </div>
        <div class="row" id="video-embed-row" hidden>
          <label>影片連結<input type="text" data-f="media_url" placeholder="https://youtu.be/..."></label>
        </div>
      </div>

      <div id="block-fields-gallery" class="block-fields" hidden>
        <p class="hint">先建立空的相簿區塊，建立後可以在下方區塊清單裡逐張新增圖片。</p>
      </div>

      <button type="button" id="add-block-btn">新增區塊到首頁下方</button>
      <p id="add-block-status" class="status"></p>
    </section>

    <section class="panel">
      <h2>目前的內容區塊</h2>
      <div id="block-list"></div>
    </section>
  </main>

  <script src="/admin/admin.js" data-page="home-blocks"></script>
</body>
</html>
