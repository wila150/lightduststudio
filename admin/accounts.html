<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帳號管理｜LightDust Studio</title>
<link rel="stylesheet" href="admin.css">
<link rel="icon" type="image/png" href="../images/favicon-32.png">
</head>
<body>
  <header class="admin-header">
    <div class="brand">LightDust <span>Studio</span></div>
    <nav class="admin-nav">
      <a href="index.html">作品集</a>
      <a href="settings.html">網站設定</a>
      <a href="nav.html">導覽選單</a>
      <a href="hero.html">首頁 Hero</a>
      <a href="pages.html">自訂頁面</a>
      <a href="messages.html">訊息中心<span id="unread-badge" class="badge" hidden></span></a>
      <a href="media.html">媒體庫</a>
      <a href="accounts.html" id="accounts-nav-link" class="active">帳號管理</a>
    </nav>
    <button id="logout-btn" class="ghost-btn">登出</button>
  </header>

  <main class="admin-main">
    <section class="panel">
      <h2>我的 Google 帳號</h2>
      <div class="google-panel">
        <p class="current-email" id="my-email-status">載入中…</p>
        <div class="row">
          <label style="flex:1 1 260px;">綁定 / 更改 Email
            <input type="email" id="my-email-input" placeholder="you@gmail.com">
          </label>
          <button type="button" id="save-email-btn" style="align-self:flex-end;padding:10px 22px;border:none;background:var(--text);color:#fff;cursor:pointer;">儲存</button>
        </div>
        <p class="hint">綁定後，這個 Google 帳號登入時的 Email 要跟這裡填的完全一致，才能用「使用 Google 登入」進到後台。</p>
        <p id="my-email-form-status" class="status"></p>
      </div>
    </section>

    <section class="panel" id="not-super-admin-note" hidden>
      <p class="hint">只有最高管理員可以新增或刪除其他後台帳號。</p>
    </section>

    <div id="accounts-app" hidden>
      <section class="panel">
        <h2>新增管理員帳號</h2>
        <form id="add-account-form" class="add-form">
          <div class="row">
            <label>帳號
              <input type="text" name="username" required>
            </label>
            <label>密碼（至少 6 個字元）
              <input type="password" name="password" required minlength="6">
            </label>
            <label>角色
              <select name="role">
                <option value="admin">一般管理員</option>
                <option value="super_admin">最高管理員</option>
              </select>
            </label>
          </div>
          <button type="submit">建立帳號</button>
          <p id="add-account-status" class="status"></p>
        </form>
      </section>

      <section class="panel">
        <h2>帳號列表</h2>
        <div id="account-list"></div>
      </section>
    </div>
  </main>

  <script src="admin.js" data-page="accounts"></script>
</body>
</html>
