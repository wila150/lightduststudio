<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>導覽選單｜LightDust Studio</title>
<link rel="stylesheet" href="admin.css">
<link rel="icon" type="image/png" href="../images/favicon-32.png">
</head>
<body>
  <header class="admin-header">
    <div class="brand">LightDust <span>Studio</span></div>
    <nav class="admin-nav">
      <a href="index.html">作品集</a>
      <a href="settings.html">網站設定</a>
      <a href="nav.html" class="active">導覽選單</a>
      <a href="hero.html">首頁 Hero</a>
      <a href="pages.html">自訂頁面</a>
      <a href="messages.html">訊息中心<span id="unread-badge" class="badge" hidden></span></a>
      <a href="media.html">媒體庫</a>
      <a href="accounts.html" id="accounts-nav-link" hidden>帳號管理</a>
    </nav>
    <button id="logout-btn" class="ghost-btn">登出</button>
  </header>

  <main class="admin-main">
    <section class="panel">
      <h2>新增主選單項目</h2>
      <p class="hint">主選單項目顯示在導覽列上（建議用英文，如 Photography）。若不需要下拉子選單，可直接填連結網址；若有子選單，網址留空即可。</p>
      <form id="add-parent-form" class="add-form">
        <div class="row">
          <label>名稱
            <input type="text" name="label" placeholder="例如 Photography" required>
          </label>
          <label>連結網址（選填，無子選單時使用）
            <input type="text" name="url" placeholder="例如 photography.html">
          </label>
          <label>排序
            <input type="number" name="sort_order" value="0">
          </label>
        </div>
        <button type="submit">新增主選單</button>
        <p id="add-parent-status" class="status"></p>
      </form>
    </section>

    <section class="panel">
      <h2>選單結構</h2>
      <div id="nav-tree"></div>
    </section>
  </main>

  <script src="admin.js" data-page="nav"></script>
</body>
</html>
